# All configuration comes from the root .env (copied manually onto the VPS).
# Build the FE locally (npm run build) and commit frontend/dist — Caddy serves it.
services:
  db:
    image: postgres:16-alpine
    container_name: drawwithme-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - dbdata:/var/lib/postgresql/data
    # Bound to localhost only — never expose Postgres publicly.
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: drawwithme-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: '3000'
      CORS_ORIGIN: ${CORS_ORIGIN}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      # Admin panel: seeds one admin on boot + signs admin tokens.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-}
    # Bound to localhost (nginx reaches it via the internal docker network).
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'

  web:
    image: caddy:2-alpine
    container_name: drawwithme-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Domains Caddy serves + auto-provisions TLS for.
      # MUST be SPACE-separated — a bare comma makes Caddy fail to start.
      SITE_ADDRESS: ${SITE_ADDRESS:-tranminhphu.com www.tranminhphu.com}
    volumes:
      - ./frontend/dist/frontend/browser:/srv:ro
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # persists issued certs across restarts (avoid LE rate limits)
      - caddy_config:/config
    ports:
      - '80:80'
      - '443:443'

volumes:
  dbdata:
  caddy_data:
  caddy_config:
