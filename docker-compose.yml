# All configuration comes from the root .env (copied manually onto the VPS).
# Build the FE locally (npm run build) and commit frontend/dist — Caddy serves it.
services:
  db:
    image: postgres:16-alpine
    container_name: drawwithme-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - dbdata:/var/lib/postgresql/data
    # Bound to localhost only — never expose Postgres publicly.
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: drawwithme-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: '3000'
      CORS_ORIGIN: ${CORS_ORIGIN}
    # Bound to localhost (nginx reaches it via the internal docker network).
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'

  web:
    image: caddy:2-alpine
    container_name: drawwithme-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Domains Caddy serves; with real domains it auto-provisions Let's Encrypt
      # TLS. Use ":80" for local/no-TLS testing.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./frontend/dist/frontend/browser:/srv:ro
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # persists issued certs across restarts (avoid LE rate limits)
      - caddy_config:/config
    ports:
      - '80:80'
      - '443:443'

volumes:
  dbdata:
  caddy_data:
  caddy_config:
