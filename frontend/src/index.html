<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DrawWithMe — Collaborative Drawing</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f0612e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DrawWithMe" />
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
    <link rel="icon" type="image/png" href="favicon-48.png" />

    <!-- SEO + link-preview (Open Graph / Twitter) -->
    <meta
      name="description"
      content="Join a room and draw, chat, and react together in real time. Create collaborative art with friends and teammates."
    />
    <link rel="canonical" href="https://tranminhphu.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DrawWithMe" />
    <meta property="og:title" content="DrawWithMe — Draw together in real time" />
    <meta
      property="og:description"
      content="Join a room and draw, chat, and react together in real time. Collaborative art with friends and teammates."
    />
    <meta property="og:url" content="https://tranminhphu.com/" />
    <meta property="og:image" content="https://tranminhphu.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DrawWithMe logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DrawWithMe — Draw together in real time" />
    <meta
      name="twitter:description"
      content="Join a room and draw, chat, and react together in real time."
    />
    <meta name="twitter:image" content="https://tranminhphu.com/og-image.png" />

    <!-- Apply theme before first paint to avoid a flash of the wrong mode. -->
    <script>
      (function () {
        try {
          // Default to LIGHT; only go dark if the user explicitly chose it.
          if (localStorage.getItem('dwm.theme') === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Fonts: Manrope (UI), JetBrains Mono (hex/coords), Material Symbols (icons) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
