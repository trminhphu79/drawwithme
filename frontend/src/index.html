<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DrawWithMe — Collaborative Drawing</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f7f9fb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DrawWithMe" />
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
    <link rel="icon" type="image/png" href="favicon-48.png" />

    <!-- SEO + link-preview (Open Graph / Twitter) -->
    <meta
      name="description"
      content="A quiet little canvas for two — or a few. Trade doodles, wander through colors, and make something tender together."
    />
    <link rel="canonical" href="https://drawwithme.co/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DrawWithMe" />
    <meta property="og:title" content="DrawWithMe — a little canvas for two" />
    <meta
      property="og:description"
      content="A quiet little canvas for two — or a few. Trade doodles, wander through colors, and make something tender together."
    />
    <meta property="og:url" content="https://drawwithme.co/" />
    <meta property="og:image" content="https://drawwithme.co/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DrawWithMe logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DrawWithMe — a little canvas for two" />
    <meta
      name="twitter:description"
      content="Trade doodles, wander through colors, and make something tender together."
    />
    <meta name="twitter:image" content="https://drawwithme.co/og-image.png" />


    <!-- Fonts: Manrope (UI), JetBrains Mono (hex/coords) from Google;
         Material Symbols icons are self-hosted (subset) + preloaded below. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap"
      rel="stylesheet"
    />
    <!-- Self-hosted icon font: preload so it's ready before first paint. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="fonts/material-symbols-subset.woff2"
      crossorigin=""
    />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
