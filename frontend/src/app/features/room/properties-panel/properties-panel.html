<div class="glass-panel rounded-xl elevation-3 flex flex-col p-6 h-full overflow-hidden">
  <h3 class="text-label-md font-bold mb-6 uppercase tracking-widest text-on-surface-variant">Properties</h3>

  <div class="space-y-8 flex-1 overflow-y-auto custom-scrollbar pr-1">
    <!-- Stroke weight -->
    <div>
      <div class="flex justify-between items-center mb-4">
        <label class="text-label-sm font-bold uppercase tracking-tighter opacity-60">Stroke Weight</label>
        <span class="text-xs font-bold text-secondary bg-secondary/10 px-2 py-0.5 rounded">{{ size() }}px</span>
      </div>
      <input
        type="range" min="1" max="128" [value]="size()" (input)="onSize($event)"
        class="range-soft" [style.background]="trackBg(size(), 1, 128)" aria-label="Stroke weight" />
      <div class="flex justify-between text-[10px] mt-2 font-bold opacity-40">
        <span>1px</span><span>128px</span>
      </div>
    </div>

    <!-- Opacity (hidden for eraser) -->
    @if (tool() !== 'eraser') {
      <div>
        <div class="flex justify-between items-center mb-4">
          <label class="text-label-sm font-bold uppercase tracking-tighter opacity-60">Opacity</label>
          <span class="text-xs font-bold text-secondary bg-secondary/10 px-2 py-0.5 rounded">{{ opacity() }}%</span>
        </div>
        <input
          type="range" min="10" max="100" [value]="opacity()" (input)="onOpacity($event)"
          class="range-soft" [style.background]="trackBg(opacity(), 10, 100)" aria-label="Opacity" />
      </div>
    }

    <!-- Swatches -->
    @if (tool() !== 'eraser') {
      <div class="space-y-4">
        <!-- Current color + custom picker -->
        <div class="flex items-center justify-between">
          <label class="text-label-sm font-bold uppercase tracking-tighter opacity-60">Color</label>
          <label class="flex items-center gap-2 cursor-pointer" title="Pick a custom color">
            <span class="font-mono-label text-mono-label uppercase text-on-surface-variant">{{ color() }}</span>
            <span class="relative w-9 h-9 rounded-full ring-2 ring-black/10 dark:ring-white/20 shadow-sm overflow-hidden">
              <span class="absolute inset-0" [style.background-color]="color()"></span>
              <input type="color" [value]="color()" (input)="onColorInput($event)"
                class="absolute inset-0 opacity-0 cursor-pointer" aria-label="Custom color" />
            </span>
          </label>
        </div>

        <!-- Swatch grid -->
        <div class="grid grid-cols-6 gap-2.5">
          @for (swatch of palette(); track swatch) {
            <button
              type="button" (click)="colorChange.emit(swatch)"
              class="relative w-9 h-9 rounded-full cursor-pointer shadow-sm transition-transform hover:scale-110 active:scale-95 ring-1 ring-black/10 dark:ring-white/15"
              [class.ring-2]="color() === swatch"
              [class.ring-secondary]="color() === swatch"
              [style.background-color]="swatch"
              [attr.aria-label]="'Color ' + swatch">
              @if (color() === swatch) {
                <span
                  class="material-symbols-outlined absolute inset-0 flex items-center justify-center text-[16px] font-bold"
                  [style.color]="isLight(swatch) ? '#1b1c19' : '#ffffff'">check</span>
              }
            </button>
          }
          <!-- Custom (rainbow) -->
          <label
            class="relative w-9 h-9 rounded-full cursor-pointer shadow-sm flex items-center justify-center transition-transform hover:scale-110 active:scale-95 ring-1 ring-black/10 dark:ring-white/15"
            style="background: conic-gradient(from 0deg, #ef4444, #f59e0b, #eab308, #22c55e, #06b6d4, #6366f1, #a855f7, #ef4444);"
            title="Custom color">
            <span class="material-symbols-outlined text-[16px] text-white drop-shadow">add</span>
            <input type="color" [value]="color()" (input)="onColorInput($event)"
              class="absolute inset-0 opacity-0 cursor-pointer" aria-label="Custom color" />
          </label>
        </div>

        @if (recentColors().length) {
          <div>
            <label class="text-label-sm font-bold uppercase tracking-tighter mb-2 block opacity-60">Recent</label>
            <div class="flex gap-2">
              @for (c of recentColors(); track c) {
                <button type="button" (click)="colorChange.emit(c)"
                  class="w-7 h-7 rounded-full ring-1 ring-black/10 dark:ring-white/15 hover:scale-110 transition-transform"
                  [style.background-color]="c" [attr.aria-label]="'Recent ' + c"></button>
              }
            </div>
          </div>
        }
      </div>
    }

    <!-- Layers (presentational; full layer system is a later phase) -->
    <div class="pt-4 border-t border-white/10">
      <label class="text-label-sm font-bold uppercase tracking-tighter mb-4 block opacity-60">Layers</label>
      <div class="space-y-3">
        <div class="flex items-center justify-between p-3 bg-secondary/10 border border-secondary/30 rounded-xl">
          <div class="flex items-center gap-3">
            <span class="material-symbols-outlined text-secondary" style="font-variation-settings:'FILL' 1;">visibility</span>
            <span class="text-label-md font-bold text-secondary">Sketch Draft</span>
          </div>
          <span class="material-symbols-outlined text-sm text-secondary/50">drag_indicator</span>
        </div>
        <div class="flex items-center justify-between p-3 bg-white/5 border border-white/10 rounded-xl opacity-60">
          <div class="flex items-center gap-3">
            <span class="material-symbols-outlined text-on-surface-variant">visibility_off</span>
            <span class="text-label-md font-bold text-on-surface-variant">Background</span>
          </div>
          <span class="material-symbols-outlined text-sm text-on-surface-variant/60">lock</span>
        </div>
      </div>
    </div>
  </div>
</div>
