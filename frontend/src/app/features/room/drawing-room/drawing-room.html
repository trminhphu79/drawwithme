<div class="h-dvh w-screen overflow-hidden relative bg-background text-on-background">
  <app-room-top-bar
    [roomCode]="code() || 'ROOM'"
    [participants]="store.participants()"
    [connected]="store.connected()"
    [title]="store.title()"
    [myAvatar]="myAvatar()"
    [myName]="myName()"
    (titleChange)="store.setTitle($event)"
    (invite)="onInvite()"
    (editProfile)="editProfileOpen.set(true)"
    (home)="onHome()" />

  <main class="w-full h-full pt-[var(--app-header-h)] relative">
    <!-- Canvas (fills the workspace; glass panels float over it) -->
    <section class="absolute inset-0 pt-[var(--app-header-h)] canvas-grid overflow-hidden">
      <app-canvas-stage
        [operations]="store.operations()"
        [brush]="store.brush()"
        [cursors]="store.cursors()"
        [referenceUrl]="store.referenceUrl()"
        [referenceVisible]="referenceVisible()"
        [referenceOpacity]="referenceOpacity() / 100"
        (strokeComplete)="store.commit($event)"
        (cursorMove)="store.moveCursor($event)"
        (zoomChange)="zoomPercent.set($event)" />

      <app-reaction-overlay [reactions]="chat.reactions()" />

      <!-- Quick reactions, floating above the undo/redo controls (safe-area aware) -->
      <app-reaction-bar
        class="absolute left-1/2 -translate-x-1/2 z-30 bottom-[calc(5rem_+_env(safe-area-inset-bottom))] md:bottom-32"
        (react)="chat.react($event)" />

      <app-canvas-controls
        [zoom]="zoomPercent()"
        [canUndo]="store.canUndo()"
        [canRedo]="store.canRedo()"
        (undo)="store.undo()"
        (redo)="store.redo()"
        (zoomIn)="zoomIn()"
        (zoomOut)="zoomOut()" />
    </section>

    <!-- Floating chat bubble (Messenger-style) — shown when the chat is closed -->
    <button
      type="button"
      (click)="chatOpen.set(true)"
      title="Open chat"
      class="fixed left-4 z-50 w-14 h-14 rounded-full brand-bg shadow-lg flex items-center justify-center transition-all duration-200 ease-out
             bottom-[calc(1.5rem_+_env(safe-area-inset-bottom))] hover:scale-105 active:scale-95"
      [class.opacity-0]="chatOpen()"
      [class.scale-50]="chatOpen()"
      [class.pointer-events-none]="chatOpen()">
      <span class="material-symbols-outlined text-[26px]" style="font-variation-settings:'FILL' 1;">chat</span>
    </button>

    <!-- Chat panel — scales up from the bubble (origin bottom-left) -->
    <div
      class="fixed left-4 z-50 origin-bottom-left transition-all duration-200 ease-out
             bottom-[calc(1.5rem_+_env(safe-area-inset-bottom))]
             w-80 max-w-[85vw] md:w-[26rem] md:max-w-[90vw] lg:w-[30rem]
             h-[70vh] max-h-[600px]"
      [class.opacity-100]="chatOpen()"
      [class.scale-100]="chatOpen()"
      [class.opacity-0]="!chatOpen()"
      [class.scale-90]="!chatOpen()"
      [class.translate-y-3]="!chatOpen()"
      [class.pointer-events-none]="!chatOpen()">
      <app-chat-panel
        [messages]="chat.messages()"
        [myId]="chat.myIdSig()"
        [muted]="chat.isMuted()"
        [memberCount]="store.participants().length"
        (send)="chat.send($event)"
        (toggleMute)="chat.toggleMute()"
        (close)="chatOpen.set(false)" />
    </div>

    <!-- Top-center: horizontal tool bar (sits just below the header) -->
    <div class="fixed top-[calc(var(--app-header-h)_+_0.75rem)] left-1/2 -translate-x-1/2 z-40">
      <app-tool-rail
        [tools]="tools"
        [activeTool]="store.tool()"
        [pencilStyles]="pencilStyles"
        [pencilStyle]="store.pencilStyle()"
        [color]="store.color()"
        [canFinish]="store.canUndo()"
        (toolSelect)="onToolSelect($event)"
        (styleChange)="onStyleChange($event)"
        (preferences)="onPreferences()"
        (colorChange)="store.setColor($event)"
        (finish)="onFinish()" />
    </div>

    <!-- Transient stroke-weight slider, below the tool bar (fades out on idle) -->
    <div
      class="fixed top-[calc(var(--app-header-h)_+_5rem)] left-1/2 -translate-x-1/2 z-40 transition-all duration-300 ease-out"
      [class.opacity-100]="weightVisible()"
      [class.opacity-0]="!weightVisible()"
      [class.-translate-y-2]="!weightVisible()"
      [class.pointer-events-none]="!weightVisible()">
      <app-stroke-weight [size]="store.size()" (sizeChange)="onSizeChange($event)" />
    </div>

    <!-- Mobile/tablet backdrop for properties -->
    @if (propsOpen()) {
      <div class="lg:hidden fixed inset-0 top-[var(--app-header-h)] bg-on-surface/40 backdrop-blur-sm z-40" (click)="propsOpen.set(false)"></div>
    }

    <!-- Right: properties — slide-in drawer on mobile/tablet, sidebar on desktop -->
    <aside
      class="fixed z-50 top-[var(--app-header-h)] bottom-0 right-0 w-80 max-w-[85vw] p-3 transition-all duration-300 ease-out
             lg:z-40 lg:top-20 lg:bottom-4 lg:right-4 lg:p-0 lg:max-w-none"
      [class.translate-x-0]="propsOpen()"
      [class.translate-x-full]="!propsOpen()"
      [class.lg:translate-x-0]="!propsCollapsed()"
      [class.lg:opacity-100]="!propsCollapsed()"
      [class.lg:translate-x-full]="propsCollapsed()"
      [class.lg:opacity-0]="propsCollapsed()"
      [class.lg:pointer-events-none]="propsCollapsed()">
      <button
        type="button"
        (click)="propsOpen.set(false)"
        class="lg:hidden absolute -left-2 top-1 z-10 w-9 h-9 rounded-full bg-surface-container-high text-on-surface shadow-lg flex items-center justify-center"
        aria-label="Close properties">
        <span class="material-symbols-outlined text-[20px]">close</span>
      </button>
      <app-properties-panel
        [tool]="store.tool()"
        [size]="store.size()"
        [opacity]="store.opacity()"
        [color]="store.color()"
        [palette]="store.palette()"
        [recentColors]="store.recentColors()"
        [referenceUrl]="store.referenceUrl()"
        [referenceVisible]="referenceVisible()"
        [referenceOpacity]="referenceOpacity()"
        (sizeChange)="store.setSize($event)"
        (opacityChange)="store.setOpacity($event)"
        (colorChange)="store.setColor($event)"
        (referenceFile)="onReferenceFile($event)"
        (toggleReference)="referenceVisible.set(!referenceVisible())"
        (referenceOpacityChange)="referenceOpacity.set($event)"
        (previewReference)="showRefPreview.set(true)"
        (clear)="onReset()" />
    </aside>
  </main>

  @if (showNameGate()) {
    <app-profile-gate
      heading="Join the room"
      backLabel="Back"
      [initialName]="initialName()"
      [initialAvatar]="myAvatar()"
      (save)="onNameSubmit($event)"
      (back)="onHome()" />
  }

  @if (editProfileOpen()) {
    <app-profile-gate
      heading="Edit your profile"
      backLabel="Cancel"
      [initialName]="myName()"
      [initialAvatar]="myAvatar()"
      (save)="onProfileSave($event)"
      (back)="editProfileOpen.set(false)" />
  }

  @if (confirmReset()) {
    <app-confirm-dialog
      title="Clear the canvas?"
      message="This wipes the whole drawing for everyone in the room and can't be undone."
      confirmLabel="Clear canvas"
      (confirm)="onConfirmReset()"
      (cancel)="confirmReset.set(false)" />
  }

  @if (confirmLeave()) {
    <app-confirm-dialog
      title="Leave this room?"
      message="Your drawing won't be saved as a final artwork. You can finish it (✓) to save and share instead."
      confirmLabel="Leave"
      (confirm)="onConfirmLeave()"
      (cancel)="onCancelLeave()" />
  }

  @if (confirmFinish()) {
    <app-confirm-dialog
      title="Finish & save?"
      message="This seals the artwork and takes everyone in the room to the final result."
      confirmLabel="Save"
      (confirm)="onConfirmFinish()"
      (cancel)="onCancelFinish()" />
  }

  <!-- Top toast (invite link copied, etc.) -->
  <app-toast [message]="toast()" />

  @if (showRefPreview() && store.referenceUrl(); as ref) {
    <div
      class="fixed inset-0 z-[120] bg-on-surface/70 backdrop-blur-sm flex items-center justify-center p-margin-mobile"
      (click)="showRefPreview.set(false)">
      <img [src]="ref" alt="Reference preview" class="max-w-full max-h-full rounded-xl object-contain elevation-3" />
      <button
        type="button"
        (click)="showRefPreview.set(false)"
        class="fixed top-4 right-4 w-10 h-10 flex items-center justify-center rounded-full bg-white/10 text-white hover:bg-white/20"
        aria-label="Close preview">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
  }
</div>
