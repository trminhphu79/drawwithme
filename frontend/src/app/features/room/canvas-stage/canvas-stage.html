<div
  #viewport
  class="absolute inset-0 overflow-hidden touch-none select-none"
  [style.cursor]="cursorStyle()"
  (pointerdown)="onPointerDown($event)"
  (pointermove)="onPointerMove($event)"
  (pointerup)="onPointerUp($event)"
  (pointercancel)="onPointerUp($event)"
  (pointerleave)="onPointerLeave($event)"
  (contextmenu)="$event.preventDefault()">
  <!-- Transformed "world": pans/zooms as one unit -->
  <div
    #world
    class="absolute top-0 left-0 origin-top-left will-change-transform"
    [style.transform]="transform()">
    <canvas
      #canvas
      [width]="canvasW"
      [height]="canvasH"
      class="block bg-surface-container-lowest rounded-sm border-[0.5px] border-dashed border-outline-variant/70"
      [style.width.px]="displayW"
      [style.height.px]="displayH"></canvas>

    <!-- Remote cursors (smoothly interpolated; scale with the world) -->
    @for (cursor of cursors(); track cursor.id) {
      <div
        class="cursor-smooth absolute pointer-events-none flex flex-col items-start z-10"
        [style.left.%]="(cursor.x / canvasW) * 100"
        [style.top.%]="(cursor.y / canvasH) * 100">
        <span class="material-symbols-outlined text-2xl -ml-1 -mt-1 drop-shadow-md" [class]="cursor.colorClass.split(' ')[0]"
          style="font-variation-settings:'FILL' 1;">near_me</span>
        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full shadow-lg whitespace-nowrap" [class]="cursor.colorClass">
          {{ cursor.name }}
        </span>
      </div>
    }
  </div>

  <!-- Tool-shaped cursor (mirrors the active toolbar icon) — not for Hand -->
  @if (hoverPos(); as hp) {
    @if (!isPanTool()) {
      <div
        class="pointer-events-none absolute z-20 text-on-surface drop-shadow"
        [style.left.px]="hp.x"
        [style.top.px]="hp.y"
        style="transform: translate(-2px, -3px)">
        <span class="material-symbols-outlined" style="font-size: 22px; font-variation-settings: 'FILL' 1;">{{ toolIcon() }}</span>
      </div>
    }
  }
</div>
