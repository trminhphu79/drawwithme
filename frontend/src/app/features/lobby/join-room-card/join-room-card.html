<div class="glass-panel rounded-xl elevation-3 p-8 md:p-12 flex flex-col items-center text-center relative">
  <div class="absolute top-4 right-4">
    <app-theme-toggle />
  </div>

  <!-- Logo -->
  <div class="mb-6 flex flex-col items-center gap-3">
    <img src="logo.png" alt="DrawWithMe logo" class="w-20 h-20 rounded-2xl object-contain" />
    <h1 class="text-display-lg font-extrabold brand-gradient">DrawWithMe</h1>
  </div>

  <p class="text-body-lg text-on-surface-variant mb-8 max-w-70">
    Collaborate and draw in real-time with friends and teammates.
  </p>

  <!-- Display name -->
  <div class="w-full mb-4 relative">
    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-outline">
      <span class="material-symbols-outlined text-[20px]">person</span>
    </div>
    <input
      aria-label="Your name"
      class="w-full bg-on-surface/5 border-0 border-b-2 border-outline-variant rounded-t-lg py-3 pl-12 pr-4 text-body-md text-on-surface focus:border-secondary focus:ring-0 transition-all placeholder:text-on-surface-variant/50 outline-none"
      placeholder="Your name"
      type="text"
      maxlength="24"
      [value]="name()"
      (input)="onName($event)" />
  </div>

  <!-- Room code -->
  <div class="w-full mb-4 relative">
    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-outline">
      <span class="material-symbols-outlined text-[20px]">tag</span>
    </div>
    <input
      aria-label="Room code"
      class="w-full bg-on-surface/5 border-0 border-b-2 border-outline-variant rounded-t-lg py-3 pl-12 pr-4 font-mono-label text-mono-label tracking-[0.15em] text-on-surface focus:border-secondary focus:ring-0 transition-all placeholder:text-on-surface-variant/50 outline-none"
      placeholder="ENTER ROOM CODE"
      type="text"
      maxlength="12"
      [value]="code()"
      (input)="onCode($event)"
      (keyup.enter)="join.emit()" />
  </div>

  @if (error()) {
    <p class="w-full mb-4 text-body-sm text-error text-left flex items-center gap-1">
      <span class="material-symbols-outlined text-[16px]">error</span>{{ error() }}
    </p>
  }

  <!-- Actions -->
  <div class="w-full flex flex-col gap-4 mt-2">
    <button
      type="button"
      (click)="join.emit()"
      [disabled]="!canJoin()"
      class="w-full bg-secondary text-on-secondary font-label-md uppercase py-4 rounded-lg hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed">
      @if (busy()) {
        <span class="material-symbols-outlined text-[18px] animate-spin">progress_activity</span>
      } @else {
        Join Room
        <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
      }
    </button>

    <div class="relative flex items-center py-1">
      <div class="grow border-t border-outline-variant/40"></div>
      <span class="shrink-0 mx-4 text-label-sm uppercase text-on-surface-variant">or</span>
      <div class="grow border-t border-outline-variant/40"></div>
    </div>

    <button
      type="button"
      (click)="create.emit()"
      [disabled]="!canCreate() || busy()"
      class="w-full glass-panel border border-outline-variant text-primary font-label-md uppercase py-4 rounded-lg hover:bg-on-surface/5 active:scale-[0.98] transition-all flex items-center justify-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed">
      <span class="material-symbols-outlined text-[18px]">add</span>
      Create New Room
    </button>
  </div>
</div>
