<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Join Room - DrawWithMe</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "primary-container": "#4f46e5",
                        "surface-container-high": "#dce9ff",
                        "error-container": "#ffdad6",
                        "surface-container": "#e5eeff",
                        "tertiary-container": "#a44100",
                        "surface": "#f8f9ff",

                        "on-tertiary-container": "#ffd2be",

                        "on-secondary-fixed": "#001e2f",
                        "tertiary": "#7e3000",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed-variant": "#3323cc",
                        "on-primary-container": "#dad7ff",
                        "outline-variant": "#c7c4d8",

                        "surface-bright": "#f8f9ff",

                        "xl": "0.75rem",

                    "spacing": {
                        "gutter": "16px",
                        "unit": "4px",
                        "margin-desktop": "32px",

<style>
        .glass-panel {
            background-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
        }
        .level-2-shadow {
            box-shadow: 0px 10px 40px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center font-body-lg text-body-lg">
<!-- Decorative Canvas Elements -->
<div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
<!-- Floating shapes mimicking cursors or drawings -->
<div class="absolute top-[20%] left-[15%] w-3 h-3 bg-secondary-container rounded-full opacity-50 blur-[2px]"></div>
<div class="absolute top-[60%] right-[20%] w-6 h-6 bg-tertiary-container rounded-sm opacity-40 blur-[3px] rotate-12"></div>
<div class="absolute bottom-[30%] left-[25%] w-4 h-4 bg-primary-container rounded-full opacity-60 blur-[1px]"></div>
</div>
<!-- Centered Card -->
<main class="relative z-10 w-full max-w-md px-margin-mobile md:px-0">
<div class="glass-panel rounded-xl level-2-shadow p-8 md:p-[40px] flex flex-col items-center text-center border border-outline-variant/20">
<!-- Logo area -->
<div class="mb-6 flex flex-col items-center gap-3">
<div class="w-16 h-16 bg-primary-container/10 rounded-2xl flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[32px]">gesture</span>
</div>
<h1 class="font-display-lg text-display-lg text-surface-tint">DrawWithMe</h1>
</div>
<!-- Description -->
<p class="font-body-lg text-body-lg text-on-surface-variant mb-8 max-w-[280px]">Collaborate and draw in real-time with friends and teammates.</p>
<!-- Input Field -->
<div class="w-full mb-6 relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">tag</span>
</div>
<input aria-label="Room code" class="w-full bg-[#F1F5F9] border border-outline-variant/30 rounded-lg py-3 pl-12 pr-4 font-mono-label text-mono-label text-on-surface focus:bg-white focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-outline/70 focus:outline-none" placeholder="Enter room code" type="text">
</div>
<!-- Actions -->
<div class="w-full flex flex-col gap-4">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-label-caps text-label-caps py-4 rounded-full transition-colors active:scale-[0.98] flex items-center justify-center gap-2">
                    Join Room
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-outline-variant/30"></div>
<span class="flex-shrink-0 mx-4 font-label-caps text-label-caps text-outline-variant">or</span>
<div class="flex-grow border-t border-outline-variant/30"></div>
</div>
<button class="w-full bg-transparent border border-outline-variant hover:border-primary text-primary font-label-caps text-label-caps py-4 rounded-full transition-colors active:scale-[0.98] flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]">add</span>
                    Create New Room
                </button>
</div>
</div>
<!-- Optional Footer Links (minimal) -->
<div class="mt-8 text-center flex gap-4 justify-center font-body-sm text-body-sm text-on-surface-variant">
<a class="hover:text-primary transition-colors" href="#">Help</a>
<span class="">·</span>
<a class="hover:text-primary transition-colors" href="#">Terms</a>
</div>
</main>


</body></html>
